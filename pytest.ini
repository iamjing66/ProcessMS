[pytest]
# 测试配置：异步模式、路径、标记、告警过滤
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
pythonpath = .
addopts = -ra --strict-markers -m "not smoke"
markers =
    smoke: 进程级冒烟（需启动 uvicorn，默认被跳过/不收集，使用 -m smoke 运行）
    slow: 较慢用例
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
