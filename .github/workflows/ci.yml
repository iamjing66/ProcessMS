name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 单元/接口测试（SQLite + ASGITransport）
        run: python -m pytest -q
      - name: 进程级冒烟（真实 uvicorn + SQLite）
        env:
          RUN_SMOKE: "1"
        run: python -m pytest tests/smoke -m smoke -q
